# demo-graphql: Author, Publisher, Book, Review, Category over REST, GraphQL
# and MCP. Ids are the seed's (data/*.json). Author is the only public-update
# table; the rest are public read.


[[case]]
name = "list Author"
protocol = "http"
path = "/api/author/?limit=2"
[case.expect]
status = 200
content_type = "json"
shape = "array"
[[case.expect.json]]
pointer = "/0/id"
type = "string"


[[case]]
name = "get Author author-1"
protocol = "http"
path = "/api/author/author-1"
[case.expect]
status = 200
content_type = "json"
shape = "object"
[[case.expect.json]]
pointer = "/id"
equals = "author-1"
[[case.expect.json]]
pointer = "/name"
equals = "Jane Austen"


[[case]]
name = "absent Author row is a problem 404"
protocol = "http"
path = "/api/author/yt-absent-{run}"
[case.expect]
status = 404
content_type = "application/problem+json"
shape = "problem"


[[case]]
name = "GraphQL list Author"
protocol = "graphql"
query = "{ Author(limit: 1) { id } }"
[case.expect]
status = 200
content_type = "json"
[[case.expect.json]]
pointer = "/data/Author"
type = "array"
[[case.expect.json]]
pointer = "/data/Author/0/id"
type = "string"


