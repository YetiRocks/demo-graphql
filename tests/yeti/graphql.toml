[[case]]
name = "GraphQL Author resolves books"
protocol = "graphql"
query = "{ Author(limit: 1) { id name books { title } } }"
[case.expect]
status = 200
content_type = "json"
[[case.expect.json]]
pointer = "/data/Author/0/books/0/title"
type = "string"


[[case]]
name = "GraphQL Book resolves author, publisher and reviews"
protocol = "graphql"
query = "{ Book(limit: 1) { id title author { name } publisher { name } reviews { rating } } }"
[case.expect]
status = 200
content_type = "json"
[[case.expect.json]]
pointer = "/data/Book/0/author/name"
equals = "Jane Austen"
[[case.expect.json]]
pointer = "/data/Book/0/publisher/name"
equals = "Penguin Random House"
[[case.expect.json]]
pointer = "/data/Book/0/reviews/0/rating"
type = "integer"


[[case]]
name = "GraphQL Review resolves its book"
protocol = "graphql"
query = "{ Review(limit: 1) { id rating book { title } } }"
[case.expect]
status = 200
content_type = "json"
[[case.expect.json]]
pointer = "/data/Review/0/book/title"
type = "string"


[[case]]
name = "GraphQL Book by id"
protocol = "graphql"
query = "{ Book(id: \"book-1\") { id title } }"
[case.expect]
status = 200
content_type = "json"
[[case.expect.json]]
pointer = "/data/Book/id"
equals = "book-1"
[[case.expect.json]]
pointer = "/data/Book/title"
equals = "Pride and Prejudice"


[[case]]
name = "GraphQL Book filtered by genre"
protocol = "graphql"
query = "{ Book(genre: \"Romance\") { id } }"
[case.expect]
status = 200
content_type = "json"
[[case.expect.json]]
pointer = "/data/Book"
type = "array"
[[case.expect.json]]
pointer = "/data/Book/0/id"
type = "string"


[[case]]
name = "GraphQL variables"
protocol = "graphql"
query = "query($id: ID!) { Book(id: $id) { id } }"
variables = { id = "book-2" }
[case.expect]
status = 200
content_type = "json"
[[case.expect.json]]
pointer = "/data/Book/id"
equals = "book-2"


[[case]]
name = "GraphQL unknown field is an error"
protocol = "graphql"
query = "{ yt_nope }"
[case.expect]
status = 400
content_type = "json"
[[case.expect.json]]
pointer = "/errors/0/message"
type = "string"


[[case]]
name = "REST filter by genre"
protocol = "http"
path = "/api/book/?genre==Romance&limit=1"
[case.expect]
status = 200
content_type = "json"
shape = "array"
[[case.expect.json]]
pointer = "/0/genre"
equals = "Romance"


[[case]]
name = "MCP initialize"
protocol = "mcp"
rpc = "initialize"
[case.expect]
status = 200
[[case.expect.json]]
pointer = "/result/serverInfo/name"
type = "string"
[[case.expect.json]]
pointer = "/result/protocolVersion"
type = "string"


[[case]]
name = "MCP tools/list names the table tools"
protocol = "mcp"
rpc = "tools/list"
[case.expect]
status = 200
contains = "author_list"
[[case.expect.json]]
pointer = "/result/tools"
type = "array"
[[case.expect.json]]
pointer = "/result/tools/0/name"
type = "string"


[[case]]
name = "MCP tools/call author_list"
protocol = "mcp"
rpc = "tools/call"
params = { name = "author_list", arguments = { limit = 1 } }
[case.expect]
status = 200
[[case.expect.json]]
pointer = "/result/isError"
equals = false
[[case.expect.json]]
pointer = "/result/content/0/type"
equals = "text"
[[case.expect.json]]
pointer = "/result/content/0/text"
type = "string"


[[case]]
name = "MCP unknown method is a JSON-RPC error"
protocol = "mcp"
rpc = "no/such/method"
[case.expect]
status = 200
[[case.expect.json]]
pointer = "/error/code"
equals = -32601


[[case]]
name = "MCP tools/call publisher_list"
protocol = "mcp"
rpc = "tools/call"
params = { name = "publisher_list", arguments = { limit = 1 } }
[case.expect]
status = 200
[[case.expect.json]]
pointer = "/result/isError"
equals = false
[[case.expect.json]]
pointer = "/result/content/0/text"
type = "string"


