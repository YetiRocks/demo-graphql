[[case]]
name = "WebSocket opens on Book"
protocol = "ws"
path = "/api/book"


[[case]]
name = "MQTT subscribes to Book"
protocol = "mqtt"
table = "Book"


[[case]]
name = "anonymous create on Book is refused (public grant is read)"
protocol = "http"
method = "POST"
path = "/api/book"
json = { id = "yt-{run}", title = "x", isbn = "x", authorId = "author-1" }
[case.expect]
status = 401
content_type = "application/problem+json"
shape = "problem"


[[case]]
name = "anonymous delete on Book is refused"
protocol = "http"
method = "DELETE"
path = "/api/book/book-1"
[case.expect]
status = 401
content_type = "application/problem+json"
shape = "problem"
