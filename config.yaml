name: "GraphQL Demo"
app_id: "demo-graphql"
customer_id: "yeti"
version: "1.0.0"
description: "Interactive GraphQL explorer with editable queries, mutations, and live SSE subscriptions"
schemas:
  path: schemas/graph.graphql

dataLoader: data/*.json

static:
  path: web
  route: /
  spa: true
  build:
    source: source
    command: npm run build